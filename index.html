<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termux Sinhala Hub - සිංහලෙන් Termux & Linux</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <i class="fa-solid fa-terminal"></i> <span>Termux</span>.LK
        </div>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search commands, packages, linux...">
        </div>
    </nav>

    <header class="hero">
        <h1>Termux & Linux සිංහලෙන්</h1>
        <p>ඉංග්‍රීසි බාධාවක් කරගන්නේ නැතුව, Android එකෙන්ම Linux Terminal එක හරියටම ඉගෙන ගන්න.</p>
    </header>

    <main class="container">
        <h2 class="section-title"><i class="fa-solid fa-folder-open"></i> ප්‍රධාන Folders (Categories)</h2>
        
        <!-- Folder Grid -->
        <div class="folder-grid" id="folderContainer">
            <!-- Folders will load dynamically -->
        </div>

        <!-- Command View Modal / Section -->
        <div id="commandModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle"><i class="fa-solid fa-folder"></i> Folder Name</h2>
                    <span class="close-btn" onclick="closeModal()">&times;</span>
                </div>
                <div id="commandList" class="command-list">
                    <!-- Commands will be loaded here -->
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 Termux Sinhala Guide | <a href="admin.html" class="admin-link">Admin Panel</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
